# Cloud Build pipeline: build Docker image + deploy to Cloud Run
# Triggered on push to main via Cloud Build GitHub trigger

steps:
  # When this build started. Builds start in push order, so this orders them; the deploy
  # step refuses to replace a revision from a build that started later
  # (scripts/cloudbuild-deploy.sh, scripts/deploy-order.sh).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'started'
    entrypoint: bash
    args: ['-c', 'date -u +%s > /workspace/build_started && echo "build started $$(cat /workspace/build_started)"']

  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE}'

  # Deploy to Cloud Run, unless a newer build is already live, and check it stayed live.
  # The flags (min instances, NUXT_SITE_URL, the ingest secrets) are in the script.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: bash
    args: ['-c', 'bash scripts/cloudbuild-deploy.sh "${_IMAGE}" "${COMMIT_SHA}" "$$(cat /workspace/build_started)"']

substitutions:
  _IMAGE: 'europe-north1-docker.pkg.dev/cto-roundtable/ctoroundtable/www:${COMMIT_SHA}'

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY
